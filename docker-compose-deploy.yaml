services:
  web:
    #command: python app.py
    # command: tail -f /dev/null
    image: jarin19/car-price-app-a3:latest

    # ports:
    #   - 8081:80
    environment:
      - HOST=0.0.0.0
      - PORT=80

    labels:
      # Allow Traefik to talk with your service
      - traefik.enable=true
      # Tell Traefik to use port 80
      - traefik.http.services.web-st126736.loadbalancer.server.port=80
      # This config you domain name. By default, your subdomain is web-st125985
      # If you which to change the subdomain name, you uncomment the below configuration
      - traefik.http.routers.web-st126736.rule=Host(`st126736.ml.brain.cs.ait.ac.th`)
      # Below is for enable SSL.
      - traefik.http.routers.web-st126736.tls=true
      - traefik.http.routers.web-st126736.tls.certresolver=production
      - traefik.http.routers.web-st126736.entrypoints=websecure
    # This define network. You would need to keep it like this.
    networks:
      - default
      - traefik_default

# Keep it like this too.
networks:
  default:
  traefik_default:
    external: true